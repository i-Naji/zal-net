name: tests
on: [workflow_dispatch]
jobs:
  test:
    continue-on-error: ${{ matrix.compiler == 'upstream' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [pinned]
        include:
          - os: ubuntu-latest
            compiler: upstream
    runs-on: ${{ matrix.os }}
    env:
      NIMONY_REF: ${{ matrix.compiler == 'upstream' && 'master' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja perl
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Build Nimony and test
        if: runner.os != 'Windows'
        run: |
          scripts/nimony-setup.sh build/toolchain
          NIMONY=build/toolchain/bin/nimony SUITE=full PRUNE_CASE_CACHES=1 scripts/test.sh
          MODE=release scripts/test-stdlib.sh build/toolchain
      - name: Build Nimony and test on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          scripts/nimony-setup.sh build/toolchain
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1 -Suite full -Nimony build/toolchain/bin/nimony.exe
